<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DUVERO Freight Enquiry – Template Preview</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#102b44}*{box-sizing:border-box}body{margin:0;background:#e8eef1}.sheet{width:1120px;min-height:1256px;background:white;margin:20px auto;padding:20px 18px 24px}.header{display:grid;grid-template-columns:1.05fr .78fr 210px;gap:24px;align-items:center;margin-bottom:34px}.brand{display:flex;align-items:center;gap:14px}.symbol{font-size:68px;font-weight:900;color:#009d9b;line-height:1}.brand-name{font-size:57px;font-weight:800;letter-spacing:-3px;color:#082b45;line-height:.9}.tag{font-size:13px;letter-spacing:3px;color:#8aa0b0;margin-top:12px}.header h1{font-size:37px;margin:0 0 10px}.subtitle{font-size:18px;color:#546b7d}.ref{background:#edf2f5;border-radius:11px;padding:18px;font-size:16px;color:#617586}.ref strong{display:block;color:#102b44;font-size:21px;margin:6px 0}.panel{border:1px solid #dbe5ea;border-radius:9px;overflow:hidden;margin-bottom:22px}.heading{background:linear-gradient(90deg,#f5f8fa,#fff);border-bottom:1px solid #e2e9ec;padding:17px 22px;font-size:22px;font-weight:700;color:#0a4b70}.heading .ico{color:#08709a;margin-right:14px}.summary{display:grid;grid-template-columns:repeat(4,1fr);padding:21px 14px}.summary-item{display:flex;align-items:center;gap:15px;padding:0 13px;border-right:1px solid #e0e7ec}.summary-item:last-child{border:0}.bubble{background:#e5f4fb;border-radius:50%;width:63px;height:63px;display:grid;place-items:center;font-size:29px;color:#0875a8;flex-shrink:0}.small{color:#52687c;font-size:16px;margin-bottom:6px}.value{font-size:19px;font-weight:700}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:24px}.content{padding:16px 21px 24px}.country{font-size:20px;font-weight:700;margin-bottom:17px}.kv{display:grid;grid-template-columns:155px 1fr;gap:9px;font-size:18px;margin:10px 0}.kv span:first-child{color:#52687c}.kv strong{overflow-wrap:anywhere}.goods{padding:10px 14px 17px}table{border-collapse:collapse;width:100%;font-size:15px}th{background:#f1f6f8;text-align:left;color:#28455c;font-weight:600}th,td{padding:14px 11px;border:1px solid #dce5e9}td{vertical-align:top}tfoot td{font-weight:700;text-align:right}.notes{background:#eefaf6;border:1px solid #a4e4d1;border-radius:9px;padding:18px 23px;font-size:18px;line-height:1.55}.notes h3{margin:0 0 9px;color:#0b506a}.foot{color:#8294a0;text-align:right;font-size:12px;margin-top:14px}@media print{@page{size:A4;margin:7mm}body{background:white}.sheet{width:100%;min-height:0;margin:0;padding:0;font-size:75%;zoom:.69}.panel{break-inside:avoid}.twocol{break-inside:avoid}}@media(max-width:1150px){.sheet{transform-origin:top left;transform:scale(.75);margin-bottom:-300px}} 
</style></head><body><main class="sheet" id="document"></main>
<script>
const example={reference:"RFQ-251018-001",date:"18 Oct 2026 23:41",service:"Air Freight",direction:"Import",incoterm:"EXW",transportType:"LCL",origin:{country:"China (CN)",city:"Shenzhen",postcode:"518000",address:"",party:""},destination:{country:"Denmark (DK)",city:"Hjørring",postcode:"9800",address:"",party:""},goods:[{type:"Pallet",description:"Spare parts",length:120,width:80,height:100,qty:1,weight:500,stackable:"Yes"}],readyDate:"",dangerous:"No",un:"",remarks:"",customer:{company:"TEST",registration:"DK 42464988",address:"Kystvejen 58",postcode:"9400",city:"Nørresundby",country:"Denmark",name:"TEST",email:"TEST@test.dk",phone:"+45 22172163"}};
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function val(v){return esc(v||"—")}
function kv(rows){return rows.map(([k,v])=>'<div class="kv"><span>'+esc(k)+'</span><strong>'+val(v)+'</strong></div>').join("")}
function panel(name,icon,body){return '<section class="panel"><div class="heading"><span class="ico">'+icon+'</span>'+esc(name)+'</div>'+body+'</section>'}
function renderLocationPanel(title,l){return panel(title,"📍",'<div class="content"><div class="country">'+val(l.country)+'</div>'+kv([["City",l.city],["Postal code",l.postcode],["Address",l.address],["Party",l.party]])+'</div>')}
function render(d){
 const goods=d.goods||[],weight=goods.reduce((n,g)=>n+Number(g.weight||0)*Number(g.qty||0),0),volume=goods.reduce((n,g)=>n+(Number(g.length||0)*Number(g.width||0)*Number(g.height||0)/1e6)*Number(g.qty||0),0),qty=goods.reduce((n,g)=>n+Number(g.qty||0),0);
 const stat=[["✈","Service",d.service],["⇄","Direction",d.direction],["▤","Incoterms",d.incoterm],["⬡","Transport type",d.transportType]].map(([icon,label,value])=>'<div class="summary-item"><div class="bubble">'+icon+'</div><div><div class="small">'+label+'</div><div class="value">'+val(value)+'</div></div></div>').join("");
 const rows=d.onlyKgCbm?'<tr><td>1</td><td>Bulk</td><td>'+val(d.description)+'</td><td>Only kg / CBM</td><td>'+val(d.totalPieces)+'</td><td>'+val(d.totalWeight)+'</td><td>'+val(d.totalCbm)+'</td><td>—</td></tr>':goods.map((g,i)=>'<tr><td>'+(i+1)+'</td><td>'+val(g.type)+'</td><td>'+val(g.description)+'</td><td>'+[g.length,g.width,g.height].map(val).join(" × ")+'</td><td>'+val(g.qty)+'</td><td>'+val(g.weight)+'</td><td>'+((Number(g.length||0)*Number(g.width||0)*Number(g.height||0)*Number(g.qty||0))/1e6).toFixed(3)+'</td><td>'+val(g.stackable)+'</td></tr>').join("");
 const totalQty=d.onlyKgCbm?(d.totalPieces||"—"):qty,totalWeight=d.onlyKgCbm?d.totalWeight:weight,totalVolume=d.onlyKgCbm?d.totalCbm:volume.toFixed(3);
 document.getElementById("document").innerHTML='<header class="header"><div class="brand"><div class="symbol">◢</div><div><div class="brand-name">DUVERO</div><div class="tag">GLOBAL FREIGHT & LOGISTICS</div></div></div><div><h1>Freight Enquiry</h1><div class="subtitle">Quote Request from DUVERO Website</div></div><div class="ref">Enquiry No.<strong>'+val(d.reference)+'</strong>'+val(d.date)+'</div></header>'+panel("Shipment Overview","▣",'<div class="summary">'+stat+'</div>')+'<div class="twocol">'+renderLocationPanel("Origin",d.origin)+renderLocationPanel("Destination",d.destination)+'</div>'+panel("Goods Details","⬡",'<div class="goods"><table><thead><tr><th>#</th><th>Type</th><th>Description</th><th>Dimensions (L × W × H cm)</th><th>Qty</th><th>Weight (kg)</th><th>Volume (m³)</th><th>Stackable</th></tr></thead><tbody>'+rows+'</tbody><tfoot><tr><td colspan="4">Total:</td><td>'+val(totalQty)+'</td><td>'+val(totalWeight)+' kg</td><td>'+val(totalVolume)+' m³</td><td></td></tr></tfoot></table></div>')+'<div class="twocol">'+panel("Additional Information","▦",'<div class="content">'+kv([["Ready date",d.readyDate],["Dangerous goods",d.dangerous],["UN number",d.un],["Remarks",d.remarks]])+'</div>')+panel("Customer Details","♟",'<div class="content">'+kv([["Company",d.customer.company],["Registration",d.customer.registration],["Address",d.customer.address],["Postal / city",[d.customer.postcode,d.customer.city].filter(Boolean).join(" ")],["Country",d.customer.country],["Name",d.customer.name],["Email",d.customer.email],["Phone",d.customer.phone]])+'</div>')+'</div><div class="notes"><h3>▤ &nbsp; Notes</h3>This is a quote request submitted through the DUVERO website.<br>Please provide your best all-in rate and estimated transit time.</div><div class="foot">DUVERO Global Freight & Logistics</div>';
}
render(example);
</script></body></html>
