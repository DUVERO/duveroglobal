<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DUVERO | Admin</title><meta name="robots" content="noindex,nofollow"><style>
:root{font-family:Arial,sans-serif;color:#123047;background:#f2f6f7}*{box-sizing:border-box}body{margin:0}header{background:#07344a;color:white;padding:22px 5%;display:flex;justify-content:space-between;align-items:center}header strong{font-size:25px;letter-spacing:2px}main{max-width:1200px;margin:35px auto;padding:0 20px}h1{font-size:29px}.muted{color:#607582}.panel{background:white;border:1px solid #dbe6e9;border-radius:12px;padding:24px;margin:20px 0}.bar{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;align-items:center}button{background:#078e90;color:white;border:0;border-radius:6px;padding:12px 18px;cursor:pointer;font-weight:bold}button.secondary{background:#eaf2f3;color:#153548}button:disabled{opacity:.5;cursor:not-allowed}input,select,textarea{border:1px solid #cbd9de;border-radius:6px;padding:12px;width:100%;font:inherit}label{display:block;font-size:13px;font-weight:bold;margin:12px 0 5px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.item{padding:15px;border-bottom:1px solid #edf1f3;cursor:pointer}.item:hover{background:#f4f9f9}.pill{background:#e5f7f6;padding:5px 9px;border-radius:14px;font-size:12px}.hidden{display:none!important}.total{font-size:23px;font-weight:bold}.notice{padding:12px;background:#fff6de;border-radius:7px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}@media(max-width:680px){.grid{grid-template-columns:1fr}}</style></head>
<body><header><strong>DUVERO</strong><span>Freight Quotations · Admin</span></header><main><div class="bar"><div><h1>Freight Enquiries</h1><p class="muted">Manage customer enquiries and quotations</p></div><button id="refresh" class="secondary">Refresh</button></div><div id="status" class="notice">Secure access required. This admin page must be protected with Cloudflare Access before use.</div><section id="list" class="panel"><h2>Enquiries</h2><div id="enquiries">Loading…</div></section><section id="editor" class="panel hidden"><div class="bar"><h2 id="heading">Quotation</h2><button class="secondary" id="back">← Back</button></div><div id="details"></div><div class="grid"><div><label>Currency</label><select id="currency"><option>EUR</option><option>DKK</option><option>USD</option></select></div><div><label>Estimated transit time</label><input id="transit" placeholder="7–10 days"></div><div><label>Validity (days)</label><input id="validity" type="number" min="1" value="7"></div><div><label>Incoterm</label><input id="incoterm"></div></div><h3>Price lines</h3><div id="lines"></div><button class="secondary" id="addLine">+ Add price line</button><p class="total" id="total"></p><label>Remarks / exclusions</label><textarea id="remarks" rows="3"></textarea><div class="actions"><button id="save">Save draft</button><button class="secondary" id="preview">Preview / Download PDF</button><button id="openSend">Send Quotation</button></div></section><section id="sendPanel" class="panel hidden"><h2>Confirm recipient and send</h2><p id="sendRef"></p><label>Customer email (please verify)</label><input id="recipient" type="email"><label>Email subject</label><input id="subject"><label><input type="checkbox" id="confirm" style="width:auto"> I have checked the recipient address and approve sending this quotation.</label><div class="actions"><button class="secondary" id="cancelSend">Cancel</button><button id="confirmSend">Confirm &amp; Send Quotation</button></div></section></main><script src="/admin/admin.js?v=1"></script></body></html>
